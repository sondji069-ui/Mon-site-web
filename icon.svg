<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0066E0"/>
            <stop offset="100%" stop-color="#003A8C"/>
        </linearGradient>
        <radialGradient id="highlight" cx="50%" cy="30%" r="60%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#C7DBFF"/>
        </linearGradient>
    </defs>

    <!-- Fond circulaire avec degrade -->
    <circle cx="96" cy="96" r="94" fill="url(#bgGrad)"/>
    <circle cx="96" cy="96" r="94" fill="url(#highlight)"/>

    <!-- Deux anneaux interconnectes (lien) -->
    <circle cx="72" cy="82" r="36" fill="none" stroke="url(#ringGrad)" stroke-width="8" opacity="0.95"/>
    <circle cx="120" cy="82" r="36" fill="none" stroke="url(#ringGrad)" stroke-width="8" opacity="0.95"/>

    <!-- Livre ouvert au centre -->
    <path d="M96 58 C 80 48, 58 48, 52 56 L 52 106 C 58 98, 80 98, 96 108 Z" fill="#FFFFFF"/>
    <path d="M96 58 C 112 48, 134 48, 140 56 L 140 106 C 134 98, 112 98, 96 108 Z" fill="#E0ECFF"/>

    <!-- Lignes de texte sur la page gauche -->
    <line x1="62" y1="70" x2="88" y2="70" stroke="#004AAD" stroke-width="1.5" opacity="0.4"/>
    <line x1="62" y1="80" x2="88" y2="80" stroke="#004AAD" stroke-width="1.5" opacity="0.4"/>
    <line x1="62" y1="90" x2="88" y2="90" stroke="#004AAD" stroke-width="1.5" opacity="0.4"/>

    <!-- Lignes de texte sur la page droite -->
    <line x1="104" y1="70" x2="130" y2="70" stroke="#004AAD" stroke-width="1.5" opacity="0.4"/>
    <line x1="104" y1="80" x2="130" y2="80" stroke="#004AAD" stroke-width="1.5" opacity="0.4"/>
    <line x1="104" y1="90" x2="130" y2="90" stroke="#004AAD" stroke-width="1.5" opacity="0.4"/>

    <!-- Reliure centrale du livre -->
    <line x1="96" y1="58" x2="96" y2="108" stroke="#004AAD" stroke-width="2.5"/>

    <!-- Texte EDU-LINK -->
    <text x="96" y="155" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">EDU-LINK</text>
</svg>