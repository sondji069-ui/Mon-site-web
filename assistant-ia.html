<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU-LINK - Assistant IA</title>
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'edu-blue': '#004AAD', 'edu-green': '#2EAD5E' } } } }
    </script>
    <style>
        body { background-color: #f3f4f6; }
        .message-user { background: #004AAD; color: white; }
        .message-ia { background: #f3f4f6; color: #1f2937; }

        /* ═══════════ LAYOUT PC ═══════════ */
        @media (min-width: 1024px) {
            body {
                background: linear-gradient(135deg, #004AAD 0%, #0066CC 50%, #2EAD5E 100%) !important;
                background-attachment: fixed !important;
                padding: 40px 20px !important;
                align-items: flex-start !important;
            }

            body::before {
                content: '📖 EDU-LINK';
                position: fixed;
                top: 22px;
                left: 32px;
                color: rgba(255, 255, 255, 0.9);
                font-size: 15px;
                font-weight: 800;
                letter-spacing: 2px;
                z-index: 1;
                text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            }

            body::after {
                content: "L'école connectée, l'éducation rapprochée";
                position: fixed;
                bottom: 22px;
                right: 32px;
                color: rgba(255, 255, 255, 0.7);
                font-size: 11px;
                font-style: italic;
                z-index: 1;
            }

            body > div.bg-white {
                max-width: 900px !important;
                width: 100% !important;
                height: 80vh !important;
                max-height: 850px !important;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1) !important;
            }

            body > div.bg-white > div:first-child {
                padding: 20px 28px !important;
            }

            #chat-container {
                padding: 24px 28px !important;
            }

            #chat-container .message-ia,
            #chat-container .message-user {
                max-width: 70% !important;
                font-size: 14px !important;
                line-height: 1.5 !important;
            }

            body > div.bg-white > div:last-child {
                padding: 16px 28px !important;
            }

            body > div.bg-white textarea {
                font-size: 14px !important;
                padding: 12px 16px !important;
            }

            #chat-container::-webkit-scrollbar { width: 8px; }
            #chat-container::-webkit-scrollbar-thumb {
                background: rgba(0, 74, 173, 0.25);
                border-radius: 4px;
            }
        }

        @media (min-width: 1400px) {
            body > div.bg-white {
                max-width: 1000px !important;
            }
        }
    </style>
</head>
<body class="min-h-screen flex justify-center items-start pt-10 p-4">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden flex flex-col" style="height: 90vh; max-height: 750px;">
        <div class="p-4 flex items-center gap-3 bg-edu-blue text-white">
            <button onclick="retourEspace()" class="text-2xl">⬅️</button>
            <div class="flex-1">
                <h1 class="text-base font-bold">🤖 Assistant IA</h1>
                <p class="text-[10px] opacity-90">Propulsé par Google Gemini</p>
            </div>
            <button onclick="effacerConversation()" class="text-xs bg-white bg-opacity-20 px-2 py-1 rounded-lg">Nouvelle</button>
        </div>

        <!-- Bandeau Contexte (Mode révision) -->
        <div id="bandeau-contexte-ia" class="hidden" style="background: linear-gradient(135deg, #f3e8ff, #e9d5ff); border-bottom: 1px solid #d8b4fe; padding: 10px 16px; display: flex; align-items: center; gap: 10px; z-index: 10;">
            <div style="font-size: 20px;">📚</div>
            <div style="flex: 1; min-width: 0;">
                <p style="font-size: 10px; color: #7e22ce; font-weight: 800; text-transform: uppercase; margin: 0;">Mode révision activé</p>
                <p id="titre-contexte-ia" style="font-size: 12px; font-weight: 700; color: #4c1d95; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">...</p>
            </div>
            <button onclick="quitterContexte()" style="background: white; border: none; border-radius: 8px; padding: 6px 10px; font-size: 10px; font-weight: bold; color: #7e22ce; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">Quitter</button>
        </div>

        <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-3">
            <div class="flex items-start gap-2">
                <div class="w-8 h-8 bg-edu-blue rounded-full flex items-center justify-center text-sm flex-shrink-0">🤖</div>
                <div class="message-ia p-3 rounded-2xl rounded-tl-none max-w-[80%] text-sm">
                    <p class="font-bold text-edu-blue mb-1">Bonjour ! 👋</p>
                    <p>Je suis ton assistant EDU-LINK. Pose-moi une question sur tes cours.</p>
                </div>
            </div>
            <div id="suggestions" class="flex flex-wrap gap-2 pl-10">
                <button onclick="poserSuggestion(1)" class="bg-white border border-gray-300 text-xs px-3 py-1 rounded-full">📐 Pythagore</button>
                <button onclick="poserSuggestion(2)" class="bg-white border border-gray-300 text-xs px-3 py-1 rounded-full">📊 Moyenne</button>
                <button onclick="poserSuggestion(3)" class="bg-white border border-gray-300 text-xs px-3 py-1 rounded-full">🔢 Fractions</button>
                <button onclick="poserSuggestion(4)" class="bg-white border border-gray-300 text-xs px-3 py-1 rounded-full">📚 Revisions</button>
            </div>
        </div>
        
        <div class="p-3 border-t border-gray-200 bg-white">
            <div class="flex gap-2">
                <textarea id="input-message" rows="1" placeholder="Pose ta question..." class="flex-1 px-3 py-2 rounded-xl border border-gray-300 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-edu-blue" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();envoyerMessage();}"></textarea>
                <button onclick="envoyerMessage()" id="btn-envoyer" class="bg-edu-blue text-white px-4 rounded-xl font-bold">➤</button>
            </div>
            <p class="text-[9px] text-gray-400 text-center mt-2">L'IA peut faire des erreurs. Vérifie toujours avec ton professeur.</p>
        </div>
    </div>

    <script>
        // ═══════════ CONFIGURATION GOOGLE GEMINI ═══════════
        // 👉 COLLE TA CLÉ API GOOGLE GEMINI ICI (elle commence par AIza...)
        var GEMINI_API_KEY = 'AQ.Ab8RN6Ly2mky5r0mxKmn-By1xh3y_fGlcHfyUi9c7veCY2BYXg';

        var sessionUser = sessionStorage.getItem('eduLinkUser');
        if (!sessionUser) { window.location.href = 'index.html'; }
        var currentUser = JSON.parse(sessionUser);

        var historique = [];
        var enCours = false;
        var contexteCoursActuel = null;

        var suggestionsTexte = {
            1: 'Explique-moi le theoreme de Pythagore simplement',
            2: 'Comment calculer une moyenne ponderee ?',
            3: 'Aide-moi a comprendre les fractions',
            4: 'Donne-moi 3 conseils pour mieux reviser'
        };

        // ═══════════ GESTION DU CONTEXTE (Mode Révision) ═══════════
        function chargerContexteIA() {
            var data = localStorage.getItem('ia_contexte_cours');
            if (data) {
                contexteCoursActuel = JSON.parse(data);
                document.getElementById('bandeau-contexte-ia').classList.remove('hidden');
                document.getElementById('titre-contexte-ia').innerText = contexteCoursActuel.titre + ' (' + contexteCoursActuel.matiere + ')';
                
                ajouterMessage('ia', "Bonjour ! J'ai bien lu ton cours sur **" + contexteCoursActuel.titre + "**. Pose-moi n'importe quelle question, je te répondrai uniquement en me basant sur ce texte !");
                
                // Optionnel : on peut le supprimer pour ne pas le garder éternellement
                localStorage.removeItem('ia_contexte_cours');
            }
        }

        function quitterContexte() {
            contexteCoursActuel = null;
            localStorage.removeItem('ia_contexte_cours');
            document.getElementById('bandeau-contexte-ia').classList.add('hidden');
            if (typeof toast !== 'undefined') toast.info("Mode conversation libre rétabli.");
        }

        // ═══════════ LOGIQUE DE CHAT ═══════════
        function retourEspace() {
            var pages = { eleve: 'eleve.html', enseignant: 'enseignant.html', parent: 'parent.html', admin: 'admin.html', staff: 'staff.html', super_admin: 'super-admin.html' };
            window.location.href = pages[currentUser.role] || 'index.html';
        }

        function effacerConversation() {
            if (!confirm('Effacer la conversation ?')) return;
            historique = [];
            document.getElementById('chat-container').innerHTML = '<div class="flex items-start gap-2"><div class="w-8 h-8 bg-edu-blue rounded-full flex items-center justify-center text-sm flex-shrink-0">🤖</div><div class="message-ia p-3 rounded-2xl rounded-tl-none max-w-[80%] text-sm"><p class="font-bold text-edu-blue mb-1">Conversation reinitialisee</p><p>Pose ta nouvelle question !</p></div></div>';
            if (contexteCoursActuel) {
                ajouterMessage('ia', "Je reste en mode révision sur le cours : " + contexteCoursActuel.titre);
            }
        }

        function poserSuggestion(num) {
            document.getElementById('input-message').value = suggestionsTexte[num];
            envoyerMessage();
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function ajouterMessage(role, contenu) {
            var container = document.getElementById('chat-container');
            var html = '';
            if (role === 'user') {
                html = '<div class="flex items-start gap-2 justify-end"><div class="message-user p-3 rounded-2xl rounded-tr-none max-w-[80%] text-sm">' + escapeHtml(contenu) + '</div><div class="w-8 h-8 bg-gray-200 rounded-full flex items-center justify-center text-sm flex-shrink-0">👤</div></div>';
            } else {
                // On gère le gras (Markdown simple) pour les réponses de l'IA
                var contenuFormate = escapeHtml(contenu).replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                html = '<div class="flex items-start gap-2"><div class="w-8 h-8 bg-edu-blue rounded-full flex items-center justify-center text-sm flex-shrink-0">🤖</div><div class="message-ia p-3 rounded-2xl rounded-tl-none max-w-[80%] text-sm" style="white-space: pre-wrap;">' + contenuFormate + '</div></div>';
            }
            container.innerHTML += html;
            container.scrollTop = container.scrollHeight;
        }

        function ajouterChargement(texte) {
            var container = document.getElementById('chat-container');
            container.innerHTML += '<div class="flex items-start gap-2" id="chargement-ia"><div class="w-8 h-8 bg-edu-blue rounded-full flex items-center justify-center text-sm flex-shrink-0">🤖</div><div class="message-ia p-3 rounded-2xl rounded-tl-none text-sm">' + (texte || '⏳ Réflexion en cours...') + '</div></div>';
            container.scrollTop = container.scrollHeight;
        }

        function retirerChargement() {
            var c = document.getElementById('chargement-ia');
            if (c) c.remove();
        }

        // ═══════════ APPEL À L'API GOOGLE GEMINI ═══════════
        async function envoyerMessage() {
            if (enCours) return;
            var input = document.getElementById('input-message');
            var texte = input.value.trim();
            if (!texte) return;

            if (GEMINI_API_KEY === '') {
                alert('La clé API Google Gemini n\'est pas configurée. Ouvrez le fichier assistant-ia.html et collez votre clé.');
                return;
            }

            enCours = true;
            input.value = '';

            var sugg = document.getElementById('suggestions');
            if (sugg) sugg.style.display = 'none';

            ajouterMessage('user', texte);
            ajouterChargement('⏳ Connexion à Gemini...');

            try {
                // 1. Préparation du prompt Système (Contexte ou Général)
                var systemPrompt = "Tu es un assistant pédagogique pour des élèves de lycée au Sénégal. Tu réponds de manière claire, simple, bienveillante et pédagogique. Tu expliques les notions avec des exemples concrets. Tu réponds toujours en français.";
                
                if (contexteCoursActuel) {
                    systemPrompt = "Tu es un tuteur strict. Tu dois répondre aux questions de l'élève UNIQUEMENT en te basant sur le texte du cours fourni ci-dessous. Si la réponse ne s'y trouve pas, dis poliment : 'Je ne trouve pas cette information dans ton cours.' Ne donne pas de connaissances extérieures.\n\nTexte du cours :\n" + contexteCoursActuel.texte;
                }

                // 2. Préparation du Payload pour Gemini
                var payload = {
                    system_instruction: {
                        parts: [{ text: systemPrompt }]
                    },
                    contents: [
                        {
                            role: "user",
                            parts: [{ text: texte }]
                        }
                    ],
                    generationConfig: {
                        temperature: 0.7,
                        maxOutputTokens: 500 // Réduit à 500 pour une réponse plus rapide
                    }
                };

                // 3. Appel de l'API Gemini Flash (le plus rapide et gratuit)
                var url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=' + GEMINI_API_KEY;
                
                // Ajout d'un timeout pour éviter que ça bloque
                var controller = new AbortController();
                var timeoutId = setTimeout(function() { controller.abort(); }, 15000);

                // Ajout d'un timeout plus long (60 secondes pour les réseaux lents)
                var controller = new AbortController();
                var timeoutId = setTimeout(function() { controller.abort(); }, 60000);

                // On augmente le timeout à 90 secondes pour les réseaux lents et les longs textes
                var controller = new AbortController();
                var timeoutId = setTimeout(function() { controller.abort(); }, 90000);

                var response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);

                var data = await response.json();

                retirerChargement();

                // 4. Traitement de la réponse
                if (data.candidates && data.candidates.length > 0 && data.candidates[0].content) {
                    var reponse = data.candidates[0].content.parts[0].text;
                    ajouterMessage('ia', reponse);
                } else if (data.error) {
                    ajouterMessage('ia', "❌ Erreur de l'API : " + data.error.message);
                } else {
                    ajouterMessage('ia', "❌ Je n'ai pas pu générer de réponse. Vérifie ta clé API.");
                }

            } catch (err) {
                retirerChargement();
                if (err.name === 'AbortError') {
                    ajouterMessage('ia', "⏳ Le serveur de Google met trop de temps à répondre (ou le texte du cours est très long). Réessaie dans un instant ou pose une question plus courte.");
                } else {
                    ajouterMessage('ia', "❌ Erreur réseau : " + err.message);
                }
            }

            enCours = false;
        }

        // Lancer la vérification du contexte au chargement de la page
        window.addEventListener('load', chargerContexteIA);
    </script>
    <script src="pwa.js"></script>
    <script src="theme.js"></script>
</body>
</html>
