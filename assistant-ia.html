<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU-LINK - Assistant IA</title>
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { 'edu-blue': '#004AAD', 'edu-green': '#2EAD5E' } } } }
    </script>
    <style>
        body { background-color: #f3f4f6; }
        .message-user { background: #004AAD; color: white; }
        .message-ia { background: #f3f4f6; color: #1f2937; }

        /* ═══════════ LAYOUT PC ═══════════ */
        @media (min-width: 1024px) {
            body {
                background: linear-gradient(135deg, #004AAD 0%, #0066CC 50%, #2EAD5E 100%) !important;
                background-attachment: fixed !important;
                padding: 40px 20px !important;
                align-items: flex-start !important;
            }

            body::before {
                content: '📖 EDU-LINK';
                position: fixed;
                top: 22px;
                left: 32px;
                color: rgba(255, 255, 255, 0.9);
                font-size: 15px;
                font-weight: 800;
                letter-spacing: 2px;
                z-index: 1;
                text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            }

            body::after {
                content: "L'école connectée, l'éducation rapprochée";
                position: fixed;
                bottom: 22px;
                right: 32px;
                color: rgba(255, 255, 255, 0.7);
                font-size: 11px;
                font-style: italic;
                z-index: 1;
            }

            body > div.bg-white {
                max-width: 900px !important;
                width: 100% !important;
                height: 80vh !important;
                max-height: 850px !important;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1) !important;
            }

            body > div.bg-white > div:first-child { padding: 20px 28px !important; }
            #chat-container { padding: 24px 28px !important; }
            #chat-container .message-ia,
            #chat-container .message-user {
                max-width: 70% !important;
                font-size: 14px !important;
                line-height: 1.5 !important;
            }
            body > div.bg-white > div:last-child { padding: 16px 28px !important; }
            body > div.bg-white textarea { font-size: 14px !important; padding: 12px 16px !important; }
            #chat-container::-webkit-scrollbar { width: 8px; }
            #chat-container::-webkit-scrollbar-thumb { background: rgba(0, 74, 173, 0.25); border-radius: 4px; }
        }

        @media (min-width: 1400px) {
            body > div.bg-white { max-width: 1000px !important; }
        }
    </style>
<!-- Bibliothèques pour formater le texte et les maths de l'IA -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <style>
        /* Un peu de style pour le texte de l'IA */
        .message-ia p { margin-bottom: 8px; }
        .message-ia ul { list-style-type: disc; padding-left: 20px; margin-bottom: 8px; }
        .message-ia ol { list-style-type: decimal; padding-left: 20px; margin-bottom: 8px; }
        .message-ia h3 { font-weight: bold; margin-top: 10px; margin-bottom: 5px; color: #004AAD; }
        .message-ia strong { font-weight: bold; }
        .message-ia code { background: #e5e7eb; padding: 2px 4px; border-radius: 4px; font-family: monospace; }
    </style>
</head>
<body class="min-h-screen flex justify-center items-start pt-10 p-4">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden flex flex-col" style="height: 90vh; max-height: 750px;">
        
        <div class="p-4 flex items-center gap-3 bg-edu-blue text-white">
            <button onclick="retourEspace()" class="text-2xl">⬅️</button>
            <div class="flex-1">
                <h1 class="text-base font-bold">🤖 Assistant IA</h1>
                <p class="text-[10px] opacity-90">Propulsé par Groq (Llama 3)</p>
            </div>
            <button onclick="effacerConversation()" class="text-xs bg-white bg-opacity-20 px-2 py-1 rounded-lg">Nouvelle</button>
        </div>

        <!-- BANDEAU CONTEXTE (Mode Révision) -->
        <div id="bandeau-contexte-ia" class="hidden" style="background: linear-gradient(135deg, #f3e8ff, #e9d5ff); border-bottom: 1px solid #d8b4fe; padding: 10px 16px; display: flex; align-items: center; gap: 10px; z-index: 10;">
            <div style="font-size: 20px;">📚</div>
            <div style="flex: 1;">
                <p style="font-size: 10px; color: #7e22ce; font-weight: 800; text-transform: uppercase; margin: 0;">Mode révision activé</p>
                <p id="titre-contexte-ia" style="font-size: 12px; font-weight: 700; color: #4c1d95; margin: 0;">...</p>
            </div>
            <button onclick="quitterContexte()" style="background: white; border: none; border-radius: 8px; padding: 6px 12px; font-size: 10px; font-weight: bold; color: #7e22ce; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">Quitter</button>
        </div>

        <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-3">
            <div class="flex items-start gap-2">
                <div class="w-8 h-8 bg-edu-blue rounded-full flex items-center justify-center text-sm flex-shrink-0">🤖</div>
                <div class="message-ia p-3 rounded-2xl rounded-tl-none max-w-[80%] text-sm">
                    <p class="font-bold text-edu-blue mb-1">Bonjour ! 👋</p>
                    <p>Je suis ton assistant EDU-LINK. Pose-moi une question sur tes cours.</p>
                </div>
            </div>
            <div id="suggestions" class="flex flex-wrap gap-2 pl-10">
                <button onclick="poserSuggestion(1)" class="bg-white border border-gray-300 text-xs px-3 py-1 rounded-full">📐 Pythagore</button>
                <button onclick="poserSuggestion(2)" class="bg-white border border-gray-300 text-xs px-3 py-1 rounded-full">📊 Moyenne</button>
                <button onclick="poserSuggestion(3)" class="bg-white border border-gray-300 text-xs px-3 py-1 rounded-full">🔢 Fractions</button>
                <button onclick="poserSuggestion(4)" class="bg-white border border-gray-300 text-xs px-3 py-1 rounded-full">📚 Revisions</button>
            </div>
        </div>

        <div class="p-3 border-t border-gray-200 bg-white">
            <div class="flex gap-2">
                <textarea id="input-message" rows="1" placeholder="Pose ta question..." class="flex-1 px-3 py-2 rounded-xl border border-gray-300 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-edu-blue" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();envoyerMessage();}"></textarea>
                <button onclick="envoyerMessage()" id="btn-envoyer" class="bg-edu-blue text-white px-4 rounded-xl font-bold">➤</button>
            </div>
            <p class="text-[9px] text-gray-400 text-center mt-2">L'IA peut faire des erreurs. Vérifie toujours avec ton professeur.</p>
        </div>
    </div>

    <script>
        // ⚠️ COLLE TA NOUVELLE CLÉ GROQ ICI (elle commence par gsk_)
        var GROQ_API_KEY = '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';

        var sessionUser = localStorage.getItem('eduLinkUser')
        if (!sessionUser) { window.location.href = 'index.html'; }
        var currentUser = JSON.parse(sessionUser);

        var historique = [];
        var enCours = false;
        var modeleQuiMarche = null;
        var contexteCoursActuel = null;

        // Modèles disponibles sur Groq
        var MODELES_GRATUITS = [
            'openai/gpt-oss-120b',
            'meta-llama/llama-4-maverick-17b-128e-instruct',
            'qwen/qwen3-32b'
        ];

        var suggestionsTexte = {
            1: 'Explique-moi le theoreme de Pythagore simplement',
            2: 'Comment calculer une moyenne ponderee ?',
            3: 'Aide-moi a comprendre les fractions',
            4: 'Donne-moi 3 conseils pour mieux reviser'
        };

        // ════════════ GESTION DU CONTEXTE ════════════
        function chargerContexteIA() {
            var data = localStorage.getItem('ia_contexte_cours');
            if (data) {
                contexteCoursActuel = JSON.parse(data);
                document.getElementById('bandeau-contexte-ia').classList.remove('hidden');
                document.getElementById('titre-contexte-ia').innerText = contexteCoursActuel.titre + ' (' + contexteCoursActuel.matiere + ')';
                
                ajouterMessage('ia', "Bonjour ! J'ai bien lu ton cours sur **" + contexteCoursActuel.titre + "**. Pose-moi n'importe quelle question, je te répondrai uniquement en me basant sur ce texte !");
            }
        }
        
        function quitterContexte() {
            contexteCoursActuel = null;
            localStorage.removeItem('ia_contexte_cours');
            document.getElementById('bandeau-contexte-ia').classList.add('hidden');
            toast.info("Mode conversation libre rétabli.");
        }

        window.addEventListener('load', chargerContexteIA);

        function retourEspace() {
            var pages = { eleve: 'eleve.html', enseignant: 'enseignant.html', parent: 'parent.html', admin: 'admin.html', staff: 'staff.html', super_admin: 'super-admin.html' };
            window.location.href = pages[currentUser.role] || 'index.html';
        }

        function effacerConversation() {
            if (!confirm('Effacer la conversation ?')) return;
            historique = [];
            document.getElementById('chat-container').innerHTML = '<div class="flex items-start gap-2"><div class="w-8 h-8 bg-edu-blue rounded-full flex items-center justify-center text-sm flex-shrink-0">🤖</div><div class="message-ia p-3 rounded-2xl rounded-tl-none max-w-[80%] text-sm"><p class="font-bold text-edu-blue mb-1">Conversation reinitialisee</p><p>Pose ta nouvelle question !</p></div></div>';
            if (contexteCoursActuel) {
                chargerContexteIA();
            }
        }

        function poserSuggestion(num) {
            document.getElementById('input-message').value = suggestionsTexte[num];
            envoyerMessage();
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTexteIA(texte) {
            // 1. On protège les formules mathématiques pour que Marked ne les détruise pas
            var blocsMath = [];
            // Regex qui attrape \( ... \), \[ ... \], $$ ... $$ et $ ... $
            var regex = /(\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]|\$\$[\s\S]*?\$\$|\$[^$\n]+\$)/g;
            
            var texteProtege = texte.replace(regex, function(match) {
                var index = blocsMath.length;
                blocsMath.push(match);
                return `%%KATEX_BLOCK_${index}%%`; // On remplace temporairement par un code secret
            });

            // 2. On formate le texte (listes, gras, etc.) avec Marked
            var htmlFormate = marked.parse(texteProtege);
            
            // 3. On remet les maths en les dessinant avec KaTeX
            htmlFormate = htmlFormate.replace(/%%KATEX_BLOCK_(\d+)%%/g, function(match, index) {
                var math = blocsMath[index];
                var estDisplay = math.startsWith('\\[') || math.startsWith('$$');
                
                // On enlève les délimiteurs pour ne garder que l'expression
                var expression = math.replace(/^\\\(|\\\)$|^\\\[|\\\]$|^\$\$|\$\$$|^\$|\$$/g, '');

                try {
                    return katex.renderToString(expression, {
                        throwOnError: false,
                        displayMode: estDisplay
                    });
                } catch (e) {
                    return match; // Si ça plante, on affiche le code d'origine
                }
            });

            return htmlFormate;
        }

        function ajouterMessage(role, contenu) {
            var container = document.getElementById('chat-container');
            var html = '';
            if (role === 'user') {
                html = '<div class="flex items-start gap-2 justify-end"><div class="message-user p-3 rounded-2xl rounded-tr-none max-w-[80%] text-sm">' + escapeHtml(contenu) + '</div><div class="w-8 h-8 bg-gray-200 rounded-full flex items-center justify-center text-sm flex-shrink-0">👤</div></div>';
            } else {
                // C'est ici qu'on utilise la fonction de formatage au lieu de escapeHtml
                var texteFormate = formatTexteIA(contenu);
                html = '<div class="flex items-start gap-2"><div class="w-8 h-8 bg-edu-blue rounded-full flex items-center justify-center text-sm flex-shrink-0">🤖</div><div class="message-ia p-3 rounded-2xl rounded-tl-none max-w-[80%] text-sm" style="overflow-x: auto;">' + texteFormate + '</div></div>';
            }
            container.innerHTML += html;
            container.scrollTop = container.scrollHeight;
        }

        function ajouterChargement(texte) {
            var container = document.getElementById('chat-container');
            container.innerHTML += '<div class="flex items-start gap-2" id="chargement-ia"><div class="w-8 h-8 bg-edu-blue rounded-full flex items-center justify-center text-sm flex-shrink-0">🤖</div><div class="message-ia p-3 rounded-2xl rounded-tl-none text-sm">' + (texte || '⏳ Reponse en cours...') + '</div></div>';
            container.scrollTop = container.scrollHeight;
        }

        function retirerChargement() {
            var c = document.getElementById('chargement-ia');
            if (c) c.remove();
        }

        async function essayerModele(modele, messages) {
            // Appel API Groq (format OpenAI standard)
            var payload = {
                model: modele,
                messages: messages,
                temperature: 0.7,
                max_tokens: 1024
            };

            var response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + GROQ_API_KEY
                },
                body: JSON.stringify(payload)
            });

            return await response.json();
        }

        async function envoyerMessage() {
            if (enCours) return;
            var input = document.getElementById('input-message');
            var texte = input.value.trim();
            if (!texte) { alert('Ecrivez une question.'); return; }

            if (GROQ_API_KEY === '' || GROQ_API_KEY === 'gsk-COLLE_TA_NOUVELLE_CLE_ICI') {
                alert('La clé API Groq n\'est pas configurée. Ouvrez le fichier assistant-ia.html et collez votre clé.');
                return;
            }

            enCours = true;
            input.value = '';

            var sugg = document.getElementById('suggestions');
            if (sugg) sugg.style.display = 'none';

            ajouterMessage('user', texte);
            ajouterChargement('⏳ Groq réfléchit...');

            var systemPrompt = 'Tu es un assistant pedagogique pour des eleves de lycee au Senegal. Tu reponds de maniere claire, simple, bienveillante et pedagogique. Tu expliques les notions avec des exemples concrets. Tu reponds toujours en francais.';
            
            if (contexteCoursActuel) {
                systemPrompt = "Tu es un tuteur. Tu dois répondre aux questions de l'élève UNIQUEMENT en te basant sur le texte du cours suivant. Si la réponse ne s'y trouve pas, dis : 'Je ne trouve pas cette information dans ton cours.'\n\nTexte du cours :\n" + contexteCoursActuel.texte;
            }

            var messages = [
                { role: 'system', content: systemPrompt },
                { role: 'user', content: texte }
            ];

            var listeAEssayer = MODELES_GRATUITS.slice();
            if (modeleQuiMarche) {
                listeAEssayer = [modeleQuiMarche].concat(listeAEssayer);
            }

            var data = null;
            var erreurs = [];

            for (var j = 0; j < listeAEssayer.length; j++) {
                try {
                    document.getElementById('chargement-ia').innerHTML = '<div class="w-8 h-8 bg-edu-blue rounded-full flex items-center justify-center text-sm flex-shrink-0">🤖</div><div class="message-ia p-3 rounded-2xl rounded-tl-none text-sm">⏳ Test du modele ' + (j + 1) + '...</div>';
                    var resultat = await essayerModele(listeAEssayer[j], messages);
                    
                    if (resultat && resultat.choices && resultat.choices[0] && resultat.choices[0].message) {
                        data = resultat;
                        modeleQuiMarche = listeAEssayer[j];
                        break;
                    } else if (resultat && resultat.error) {
                        erreurs.push(listeAEssayer[j] + ' -> ' + (resultat.error.message || 'erreur'));
                    }
                } catch (e) {
                    erreurs.push(listeAEssayer[j] + ' -> ' + e.message);
                }
            }

            retirerChargement();

            if (data && data.choices && data.choices[0] && data.choices[0].message) {
                var reponse = data.choices[0].message.content;
                ajouterMessage('ia', reponse);
                historique.push({ role: 'user', content: texte });
                historique.push({ role: 'assistant', content: reponse });
            } else {
                var msgErreur = '😔 Aucun modele n\'a repondu.\n\nDétails de l\'erreur :\n' + erreurs.slice(0, 3).join('\n');
                ajouterMessage('ia', msgErreur);
            }

            enCours = false;
        }
    </script>
    <script src="pwa.js"></script>
    <script src="theme.js"></script>
</body>
</html>
