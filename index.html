    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFid2d1aXhjbG14dHp2bHNtYmJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4OTg1OTMsImV4cCI6MjEwNjQ3NDU5M30.8MiG5YdoMIY69KYfBdlXHIB9Zisd5miX3slaCoqVcjM';
        const supabaseUrl = 'https://abwguixclmxtzvlsmbby.supabase.co';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
const AUTH_SALT = 'EDU-LINK::v1::S3n3g4l::2024';
        const AUTH_ITERATIONS = 100000;
        const AUTH_PREFIX = 'pbkdf2$';

        async function hashPassword(plainPassword) {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(plainPassword), { name: 'PBKDF2' }, false, ['deriveBits']);
            const hashBuffer = await crypto.subtle.deriveBits(
                { name: 'PBKDF2', salt: enc.encode(AUTH_SALT), iterations: AUTH_ITERATIONS, hash: 'SHA-256' },
                keyMaterial, 256
            );
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return AUTH_PREFIX + AUTH_ITERATIONS + '$' + hex;
        }

        async function verifyPassword(plainPassword, storedPassword) {
            if (!storedPassword) return { ok: false, needsRehash: false };
            if (storedPassword.startsWith(AUTH_PREFIX)) {
                const hashCalcule = await hashPassword(plainPassword);
                return { ok: hashCalcule === storedPassword, needsRehash: false };
            }
            if (storedPassword === plainPassword) {
                return { ok: true, needsRehash: true };
            }
            return { ok: false, needsRehash: false };
        }

        var imagesFallback = [
            'https://images.pexels.com/photos/256541/pexels-photo-256541.jpeg?auto=compress&cs=tinysrgb&w=1200',
            'https://images.pexels.com/photos/207691/pexels-photo-207691.jpeg?auto=compress&cs=tinysrgb&w=1200',
            'https://images.pexels.com/photos/159775/library-la-trobe-study-students-159775.jpeg?auto=compress&cs=tinysrgb&w=1200'
        ];

        var indexImage = 0;
        var fondDiv = document.querySelector('.fond-image');

        function testerImage() {
            if (indexImage >= imagesFallback.length) return;
            var img = new Image();
            img.onload = function() { fondDiv.style.backgroundImage = 'url(' + imagesFallback[indexImage] + ')'; };
            img.onerror = function() { indexImage++; testerImage(); };
            img.src = imagesFallback[indexImage];
        }
        testerImage();

        function remplir(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
        }

        function togglePassword() {
            const input = document.getElementById('password');
            const oeil = document.getElementById('oeil');
            if (input.type === 'password') { input.type = 'text'; oeil.innerText = '🙈'; }
            else { input.type = 'password'; oeil.innerText = '👁️'; }
        }

        function afficherMessage(texte, couleur) {
            const div = document.getElementById('message-login');
            div.innerText = texte;
            div.className = 'mb-3 text-center text-xs font-semibold py-2 px-3 rounded-lg';
            div.classList.remove('hidden');
            if (couleur === 'rouge') div.classList.add('text-red-600');
            else if (couleur === 'vert') div.classList.add('text-edu-green');
            else if (couleur === 'orange') div.classList.add('text-edu-orange');
        }

        function resetBtn(btn, btnText) {
            btn.disabled = false;
            btn.classList.remove('opacity-80');
            btnText.innerText = 'Se connecter';
        }

        document.getElementById('btnLogin').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('btnLogin');
            const btnText = document.getElementById('btn-text');

            if (!email || !password) {
                afficherMessage('Veuillez remplir tous les champs.', 'rouge');
                return;
            }

            btn.disabled = true;
            btn.classList.add('opacity-80');
            btnText.innerHTML = '<span class="spinner"></span> Connexion...';
            document.getElementById('message-login').classList.add('hidden');

            try {
                const { data: users, error: errReq } = await supabaseClient.from('utilisateurs').select('*').eq('email', email);

                if (errReq) {
                    afficherMessage('Erreur reseau : ' + errReq.message, 'rouge');
                    resetBtn(btn, btnText);
                    return;
                }

                if (!users || users.length === 0) {
                    afficherMessage('Email ou mot de passe incorrect.', 'rouge');
                    resetBtn(btn, btnText);
                    return;
                }

                const user = users[0];

                // Verification hybride (PBKDF2 ou clair)
                const verification = await verifyPassword(password, user.mot_de_passe);
                if (!verification.ok) {
                    afficherMessage('Email ou mot de passe incorrect.', 'rouge');
                    resetBtn(btn, btnText);
                    return;
                }

                // Migration auto en PBKDF2 si ancien mdp en clair
                if (verification.needsRehash) {
                    try {
                        const newHash = await hashPassword(password);
                        await supabaseClient.from('utilisateurs').update({ mot_de_passe: newHash }).eq('id', user.id);
                        console.log('Mot de passe migre en PBKDF2');
                    } catch (e) { console.warn('Migration echouee :', e); }
                }

                if (user.statut === 'en_attente') {
                    afficherMessage('Votre compte est en attente de validation par votre ecole.', 'orange');
                    resetBtn(btn, btnText);
                    return;
                }

                if (user.statut === 'refuse') {
                    afficherMessage('Votre demande a ete refusee. Contactez votre ecole.', 'rouge');
                    resetBtn(btn, btnText);
                    return;
                }

                // Verification ecole active
                if (user.ecole_id && user.role !== 'super_admin') {
                    const { data: ecole } = await supabaseClient.from('ecoles').select('actif, nom, date_expiration').eq('id', user.ecole_id).single();
                    if (ecole) {
                        if (ecole.actif === false) {
                            afficherMessage('L\'acces de votre ecole (' + ecole.nom + ') a ete temporairement suspendu.', 'rouge');
                            resetBtn(btn, btnText);
                            return;
                        }
                        if (ecole.date_expiration) {
                            const expiration = new Date(ecole.date_expiration);
                            const aujourdHui = new Date();
                            aujourdHui.setHours(0, 0, 0, 0);
                            if (expiration < aujourdHui) {
                                afficherMessage('L\'abonnement de votre ecole a expire.', 'rouge');
                                resetBtn(btn, btnText);
                                return;
                            }
                        }
                    }
                }

                sessionStorage.setItem('eduLinkUser', JSON.stringify(user));
                afficherMessage('Bienvenue ' + user.prenom + ' !', 'vert');
                btnText.innerText = 'Connecte !';

                const urlActuelle = window.location.href;
                const urlBase = urlActuelle.substring(0, urlActuelle.lastIndexOf('/') + 1);

                let fichierCible = '';
                if (user.role === 'eleve') fichierCible = 'eleve.html';
                else if (user.role === 'enseignant') fichierCible = 'enseignant.html';
                else if (user.role === 'parent') fichierCible = 'parent.html';
                else if (user.role === 'admin') fichierCible = 'admin.html';
                else if (user.role === 'staff') fichierCible = 'staff.html';
                else if (user.role === 'super_admin') fichierCible = 'super-admin.html';

                if (fichierCible) {
                    setTimeout(function() { window.location.replace(urlBase + fichierCible); }, 700);
                } else {
                    afficherMessage('Role inconnu.', 'rouge');
                    resetBtn(btn, btnText);
                }

            } catch (err) {
                afficherMessage('Erreur : ' + err.message, 'rouge');
                resetBtn(btn, btnText);
            }
        });

        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('btnLogin').click();
        });
    </script>
