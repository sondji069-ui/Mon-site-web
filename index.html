<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU-LINK - L'école connectée</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#004AAD">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        'edu-blue': '#004AAD', 
                        'edu-red': '#E31B23',
                    },
                    fontFamily: { 'inter': ['Inter', 'sans-serif'] }
                } 
            } 
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #050a14; overflow: hidden; height: 100vh; margin: 0; padding: 0; }
        
        /* ─── CANVAS PARTICULES ─── */
        #particle-canvas {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
        }

        /* ─── CURSEUR PERSONNALISÉ ─── */
        .custom-cursor {
            width: 30px; height: 30px;
            border: 2px solid rgba(0, 74, 173, 0.5);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, background 0.3s;
            mix-blend-mode: screen;
        }
        .custom-cursor-dot {
            width: 6px; height: 6px;
            background: #E31B23;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
        }
        /* On cache le curseur par défaut sur PC */
        @media (min-width: 1024px) {
            body, a, button, input { cursor: none !important; }
        }

        /* ─── GLASSMORPHISM PREMIUM ─── */
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 10;
        }

        /* ─── TEXTE LUMINEUX ─── */
        .text-glow {
            text-shadow: 0 0 20px rgba(0, 74, 173, 0.8), 0 0 40px rgba(0, 74, 173, 0.4);
        }
        .text-gradient-neon {
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 50%, #E31B23 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ─── INPUTS FUTURISTES ─── */
        .input-futur {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            transition: all 0.3s;
        }
        .input-futur:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
            outline: none;
        }
        .input-futur::placeholder { color: rgba(255, 255, 255, 0.3); }

        /* ─── BOUTON NÉON ─── */
        .btn-neon {
            background: linear-gradient(90deg, #004AAD, #00d2ff);
            background-size: 200% auto;
            transition: 0.5s;
            box-shadow: 0 0 20px rgba(0, 74, 173, 0.4);
        }
        .btn-neon:hover {
            background-position: right center;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.6);
        }

        /* ─── CARTES FLOTTANTES ─── */
        .floating-card {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px 16px;
            z-index: 5;
            animation: float 6s ease-in-out infinite;
            display: flex; align-items: center; gap: 10px;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }
        .fc-1 { top: 15%; left: -5%; animation-delay: 0s; }
        .fc-2 { bottom: 20%; right: -8%; animation-delay: -2s; }
        .fc-3 { top: 40%; right: -15%; animation-delay: -4s; }

        .spinner { border: 2px solid rgba(255,255,255,0.3); border-top: 2px solid white; border-radius: 50%; width: 16px; height: 16px; animation: spin 0.7s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Animations d'entrée */
        .fade-up { animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(40px); }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

    <!-- Canvas pour les particules -->
    <canvas id="particle-canvas"></canvas>

    <!-- Curseur personnalisé -->
    <div class="custom-cursor hidden lg:block" id="cursor"></div>
    <div class="custom-cursor-dot hidden lg:block" id="cursor-dot"></div>

    <div class="w-full max-w-7xl flex items-center justify-between gap-12 relative z-10">
        
        <!-- COLONNE GAUCHE : TEXTE FUTURISTE -->
        <div class="hidden lg:flex flex-col flex-1 fade-up delay-1 relative">
            
            <div class="flex items-center gap-3 mb-8">
                <div class="relative">
                    <div class="absolute inset-0 bg-blue-500 blur-xl opacity-50 rounded-full"></div>
                    <svg width="40" height="40" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="relative z-10">
                        <path d="M50 20 C 35 10, 15 10, 10 15 L 10 80 C 15 75, 35 75, 50 85 Z" fill="#fff"/>
                        <path d="M50 20 C 65 10, 85 10, 90 15 L 90 80 C 85 75, 65 75, 50 85 Z" fill="#fff"/>
                        <rect x="45" y="5" width="10" height="25" rx="2" fill="#E31B23"/>
                        <line x1="20" y1="30" x2="42" y2="30" stroke="#004AAD" stroke-width="2"/>
                        <line x1="20" y1="40" x2="42" y2="40" stroke="#004AAD" stroke-width="2"/>
                        <line x1="58" y1="30" x2="80" y2="30" stroke="#004AAD" stroke-width="2"/>
                        <line x1="58" y1="40" x2="80" y2="40" stroke="#004AAD" stroke-width="2"/>
                    </svg>
                </div>
                <span class="text-3xl font-black text-white tracking-tight text-glow">EDU-LINK</span>
            </div>

            <h1 class="text-6xl font-black leading-[1.1] mb-6 text-white tracking-tight">
                Le futur de <br>
                <span class="text-gradient-neon">l'éducation.</span>
            </h1>
            
            <p class="text-lg text-gray-400 mb-10 max-w-md font-medium leading-relaxed">
                Connectez votre école, gérez les notes, les paiements et la communication. Tout est là, dans votre poche.
            </p>
        </div>

        <!-- COLONNE DROITE : FORMULAIRE IMMERSIF -->
        <div class="w-full max-w-md fade-up delay-2 relative">
            
            <!-- Cartes flottantes décoratives -->
            <div class="floating-card fc-1 hidden lg:flex">
                <div class="w-8 h-8 rounded-full bg-green-500/20 text-green-400 flex items-center justify-center text-xs">📈</div>
                <div><p class="text-[10px] text-gray-400 font-bold uppercase">Présence</p><p class="text-sm text-white font-black">94%</p></div>
            </div>
            <div class="floating-card fc-2 hidden lg:flex">
                <div class="w-8 h-8 rounded-full bg-edu-red/20 text-edu-red flex items-center justify-center text-xs">⚠️</div>
                <div><p class="text-[10px] text-gray-400 font-bold uppercase">Alertes</p><p class="text-sm text-white font-black">3 absences</p></div>
            </div>
            
            <div class="glass-card rounded-[2rem] p-8 lg:p-10">
                <div class="text-center mb-8">
                    <h2 class="text-3xl font-black text-white mb-2">Connexion</h2>
                    <p class="text-sm text-gray-400 font-medium">Accédez à votre espace sécurisé.</p>
                </div>

                <div id="message-login" class="hidden mb-6 text-center text-xs font-bold py-3 px-3 rounded-xl"></div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Adresse email</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">✉️</span>
                            <input type="email" id="email" placeholder="votre@email.com" class="input-futur w-full pl-12 pr-4 py-3.5 rounded-xl text-sm font-medium">
                        </div>
                    </div>
                    
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider">Mot de passe</label>
                            <a href="mot-de-passe-oublie.html" class="text-[10px] font-bold text-cyan-400 hover:text-white transition-colors">Oublié ?</a>
                        </div>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">🔒</span>
                            <input type="password" id="password" placeholder="••••••••" class="input-futur w-full pl-12 pr-12 py-3.5 rounded-xl text-sm font-medium">
                            <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-cyan-400 transition-colors">
                                <span id="oeil" class="text-sm">👁️</span>
                            </button>
                        </div>
                    </div>

                    <button type="button" id="btnLogin" class="btn-neon w-full text-white font-bold py-4 rounded-xl flex justify-center items-center gap-2 mt-4 transition-all">
                        <span id="btn-text">Se connecter</span>
                    </button>
                </div>

                <div class="mt-8 pt-6 border-t border-white/10 flex flex-col gap-3 text-center">
                    <div class="flex gap-2">
                        <a href="inscription.html" class="flex-1 bg-white/5 border border-white/10 text-white font-bold py-3 rounded-xl text-xs hover:bg-white/10 transition-all">
                            Créer un compte
                        </a>
                        <a href="inscription-ecole.html" class="flex-1 bg-edu-red/10 text-edu-red font-bold py-3 rounded-xl text-xs hover:bg-edu-red/20 transition-all border border-edu-red/20">
                            Créer mon école
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        // ════════════ CURSEUR PERSONNALISÉ ════════════
        const cursor = document.getElementById('cursor');
        const cursorDot = document.getElementById('cursor-dot');
        
        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth > 1024) {
                // Le point suit instantanément
                cursorDot.style.left = e.clientX + 'px';
                cursorDot.style.top = e.clientY + 'px';
                
                // Le cercle suit avec un léger délai (effet traînée)
                setTimeout(() => {
                    cursor.style.left = e.clientX + 'px';
                    cursor.style.top = e.clientY + 'px';
                }, 50);
            }
        });

        // Effet d'agrandissement au survol des boutons
        document.querySelectorAll('button, a, input').forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.width = '50px';
                cursor.style.height = '50px';
                cursor.style.background = 'rgba(0, 210, 255, 0.1)';
                cursor.style.borderColor = 'rgba(0, 210, 255, 0.8)';
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.width = '30px';
                cursor.style.height = '30px';
                cursor.style.background = 'transparent';
                cursor.style.borderColor = 'rgba(0, 74, 173, 0.5)';
            });
        });

        // ════════════ CANVAS PARTICULES ════════════
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];
        let mouse = { x: null, y: null, radius: 150 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });

        // Redimensionner le canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }
        window.addEventListener('resize', resizeCanvas);

        // Classe Particule
        class Particle {
            constructor(x, y, directionX, directionY, size, color) {
                this.x = x; this.y = y;
                this.directionX = directionX; this.directionY = directionY;
                this.size = size; this.color = color;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
            update() {
                // Rebondir sur les bords
                if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;
                if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;

                // Interaction avec la souris (fuite)
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < mouse.radius) {
                    if (mouse.x < this.x && this.x < canvas.width - this.size * 10) this.x += 2;
                    if (mouse.x > this.x && this.x > this.size * 10) this.x -= 2;
                    if (mouse.y < this.y && this.y < canvas.height - this.size * 10) this.y += 2;
                    if (mouse.y > this.y && this.y > this.size * 10) this.y -= 2;
                }

                this.x += this.directionX;
                this.y += this.directionY;
                this.draw();
            }
        }

        function initParticles() {
            particlesArray = [];
            let numberOfParticles = (canvas.height * canvas.width) / 15000;
            let colors = ['rgba(0, 74, 173, 0.5)', 'rgba(0, 210, 255, 0.4)', 'rgba(227, 27, 35, 0.3)'];
            
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 2) + 1;
                let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                let directionX = (Math.random() * 0.4) - 0.2;
                let directionY = (Math.random() * 0.4) - 0.2;
                let color = colors[Math.floor(Math.random() * colors.length)];
                particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
            }
        }

        // Boucle d'animation
        function animateParticles() {
            requestAnimationFrame(animateParticles);
            ctx.clearRect(0, 0, innerWidth, innerHeight);
            
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
        }

        resizeCanvas();
        animateParticles();

        // ════════════ LOGIQUE DE CONNEXION ════════════
        function togglePassword() {
            const input = document.getElementById('password');
            const oeil = document.getElementById('oeil');
            if (input.type === 'password') { input.type = 'text'; oeil.innerText = '🙈'; }
            else { input.type = 'password'; oeil.innerText = '👁️'; }
        }

        function afficherMessage(texte, couleur) {
            const div = document.getElementById('message-login');
            div.innerText = texte;
            div.classList.remove('hidden');
            if (couleur === 'rouge') {
                div.className = 'mb-6 text-center text-xs font-bold py-3 px-3 rounded-xl bg-red-500/20 text-red-400 border border-red-500/30';
            } else if (couleur === 'vert') {
                div.className = 'mb-6 text-center text-xs font-bold py-3 px-3 rounded-xl bg-green-500/20 text-green-400 border border-green-500/30';
            }
        }

        function resetBtn(btn, btnText) {
            btn.disabled = false;
            btn.classList.remove('opacity-80');
            btnText.innerText = 'Se connecter';
        }

        document.getElementById('btnLogin').addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('btnLogin');
            const btnText = document.getElementById('btn-text');

            if (!email || !password) {
                afficherMessage('Veuillez remplir tous les champs.', 'rouge');
                return;
            }

            btn.disabled = true;
            btn.classList.add('opacity-80');
            btnText.innerHTML = '<span class="spinner"></span> Connexion...';
            document.getElementById('message-login').classList.add('hidden');

            try {
                const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({ email, password });

                if (authError) {
                    afficherMessage('Email ou mot de passe incorrect.', 'rouge');
                    resetBtn(btn, btnText);
                    return;
                }

                const { data: user, error: userError } = await supabaseClient.from('utilisateurs').select('*').eq('auth_id', authData.user.id).single();

                if (userError || !user) {
                    afficherMessage('Profil introuvable. Contactez votre école.', 'rouge');
                    await supabaseClient.auth.signOut();
                    resetBtn(btn, btnText);
                    return;
                }

                if (user.statut === 'en_attente') {
                    afficherMessage('Votre compte est en attente de validation par votre école.', 'rouge'); 
                    await supabaseClient.auth.signOut();
                    resetBtn(btn, btnText);
                    return;
                }

                if (user.ecole_id && user.role !== 'super_admin') {
                    const { data: ecole } = await supabaseClient.from('ecoles').select('actif, nom').eq('id', user.ecole_id).single();
                    if (ecole && ecole.actif === false) {
                        afficherMessage('L\'accès de votre école (' + ecole.nom + ') a été suspendu.', 'rouge');
                        await supabaseClient.auth.signOut();
                        resetBtn(btn, btnText);
                        return;
                    }
                }

                EduLink.setSessionUser(user);
                afficherMessage('Bienvenue ' + user.prenom + ' !', 'vert');
                btnText.innerText = 'Connecté !';

                let fichierCible = '';
                if (user.role === 'eleve') fichierCible = 'eleve.html';
                else if (user.role === 'enseignant') fichierCible = 'enseignant.html';
                else if (user.role === 'parent') fichierCible = 'parent.html';
                else if (user.role === 'admin') fichierCible = 'admin.html';
                else if (user.role === 'staff') fichierCible = 'staff.html';
                else if (user.role === 'super_admin') fichierCible = 'super-admin.html';

                if (fichierCible) setTimeout(function() { window.location.replace(fichierCible); }, 700);

            } catch (err) {
                afficherMessage('Erreur réseau : ' + err.message, 'rouge');
                resetBtn(btn, btnText);
            }
        });

        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('btnLogin').click();
        });

        // AUTO-CONNEXION
        window.addEventListener('load', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                const { data: user } = await supabaseClient.from('utilisateurs').select('*').eq('auth_id', session.user.id).single();
                if (user && user.statut === 'actif') {
                    EduLink.setSessionUser(user);
                    let fichierCible = '';
                    if (user.role === 'eleve') fichierCible = 'eleve.html';
                    else if (user.role === 'enseignant') fichierCible = 'enseignant.html';
                    else if (user.role === 'parent') fichierCible = 'parent.html';
                    else if (user.role === 'admin') fichierCible = 'admin.html';
                    else if (user.role === 'staff') fichierCible = 'staff.html';
                    else if (user.role === 'super_admin') fichierCible = 'super-admin.html';
                    if (fichierCible) window.location.replace(fichierCible);
                }
            }
        });
    </script>
    <script src="pwa.js"></script>
</body>
</html>
