<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU-LINK - Vérification</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { font-family: 'Poppins', sans-serif; background: #f3f4f6; } </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden">
        <div class="bg-edu-blue p-4 text-center text-white">
            <h1 class="text-lg font-bold">Vérification Élève</h1>
            <p class="text-xs opacity-80">EDU-LINK</p>
        </div>
        
        <div id="contenu-verification" class="p-6 text-center">
            <div class="animate-pulse flex flex-col items-center">
                <div class="w-12 h-12 bg-gray-200 rounded-full mb-4"></div>
                <div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div>
                <div class="h-3 bg-gray-200 rounded w-1/2"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        window.addEventListener('load', async () => {
            // Récupérer l'ID de l'élève depuis l'URL
            var params = new URLSearchParams(window.location.search);
            var eleveId = params.get('id');
            var conteneur = document.getElementById('contenu-verification');

            if (!eleveId) {
                conteneur.innerHTML = '<div class="text-red-500 font-bold text-2xl">❌</div><p class="text-sm text-red-500 mt-2">QR Code invalide.</p>';
                return;
            }

            // On demande à Supabase les infos de l'élève
            var res = await supabaseClient.from('eleves')
                .select('matricule, photo_url, utilisateurs!utilisateur_id(prenom, nom), classes(nom)')
                .eq('id', eleveId)
                .single();

            if (res.error || !res.data) {
                conteneur.innerHTML = '<div class="text-red-500 font-bold text-2xl">❌</div><p class="text-sm text-red-500 mt-2">Élève introuvable ou accès refusé.</p>';
                return;
            }

            var e = res.data;
            var nomComplet = (e.utilisateurs ? e.utilisateurs.prenom + ' ' + e.utilisateurs.nom : 'Inconnu');
            var classe = e.classes ? e.classes.nom : 'Sans classe';
            var initiale = nomComplet.charAt(0).toUpperCase();
            
            var avatarHtml = e.photo_url 
                ? '<img src="' + e.photo_url + '" style="width:100%; height:100%; object-fit:cover;">' 
                : initiale;

            conteneur.innerHTML = `
                <div class="w-24 h-24 mx-auto bg-blue-100 rounded-full flex items-center justify-center text-4xl font-bold text-edu-blue mb-4 overflow-hidden border-4 border-white shadow-lg">
                    ${avatarHtml}
                </div>
                <h2 class="text-xl font-extrabold text-gray-800">${nomComplet}</h2>
                <p class="text-sm text-gray-500 mb-4">${classe}</p>
                
                <div class="bg-green-50 border border-green-200 rounded-xl p-3 mb-4">
                    <p class="text-xs text-green-700 font-bold mb-1">✅ IDENTITÉ VÉRIFIÉE</p>
                    <p class="text-lg font-extrabold text-green-800">${e.matricule}</p>
                </div>

                <div class="bg-gray-50 rounded-xl p-3 text-xs text-gray-600">
                    <p>Si cette personne n'est pas l'élève mentionné ci-dessus, veuillez alerter la direction.</p>
                </div>
            `;
        });
    </script>
</body>
</html>
