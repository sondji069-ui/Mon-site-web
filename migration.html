<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDU-LINK - Migration Storage</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFid2d1aXhjbG14dHp2bHNtYmJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4OTg1OTMsImV4cCI6MjEwNjQ3NDU5M30.8MiG5YdoMIY69KYfBdlXHIB9Zisd5miX3slaCoqVcjM';
        const supabaseUrl = 'https://abwguixclmxtzvlsmbby.supabase.co';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
    </script>
    <script src="image-utils.js"></script>
    <script src="storage.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-blue-700 mb-4">🔄 Migration Storage Complète</h1>

        <div class="bg-blue-50 border border-blue-200 rounded-xl p-3 mb-4">
            <p class="text-xs text-blue-800">Cette migration va traiter tous les fichiers restants. Le 1er élément a déjà été migré lors du test.</p>
        </div>

        <button onclick="lancerMigrationComplete()" id="btn" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl mb-4">
            ▶️ Lancer la migration complète
        </button>

        <div class="bg-gray-200 rounded-full h-4 overflow-hidden mb-2">
            <div id="barre" class="bg-green-500 h-4 transition-all duration-300" style="width: 0%"></div>
        </div>
        <p id="pct" class="text-xs text-center text-gray-500 mb-4">0%</p>

        <div id="log" class="bg-gray-900 text-green-300 text-xs font-mono p-3 rounded-lg" style="height: 400px; overflow-y: auto;">
            Cliquez sur "Lancer la migration complète"...
        </div>
    </div>

    <script>
        function log(msg, type) {
            var el = document.getElementById('log');
            var color = type === 'error' ? 'text-red-400' : (type === 'success' ? 'text-green-400' : (type === 'warn' ? 'text-yellow-300' : 'text-cyan-300'));
            var time = new Date().toLocaleTimeString('fr-FR');
            el.innerHTML += '<div class="' + color + '">[' + time + '] ' + msg + '</div>';
            el.scrollTop = el.scrollHeight;
        }

        function majProgression(actuel, total) {
            var pct = total > 0 ? Math.round((actuel / total) * 100) : 0;
            document.getElementById('barre').style.width = pct + '%';
            document.getElementById('pct').innerText = pct + '% (' + actuel + '/' + total + ')';
        }

        async function lancerMigrationComplete() {
            var btn = document.getElementById('btn');
            btn.disabled = true;
            btn.innerText = '⏳ Migration en cours...';

            log('🚀 Démarrage de la migration complète...');

            var migrations = [
                { table: 'ecoles', champ: 'logo_url', bucket: 'logos' },
                { table: 'ecoles', champ: 'signature_url', bucket: 'signatures' },
                { table: 'annonces', champ: 'logo_annonce', bucket: 'logos' },
                { table: 'posts', champ: 'image_url', bucket: 'social' },
                { table: 'ressources', champ: 'fichier_base64', bucket: 'ressources' }
            ];

            var taches = [];

            // 1. Récupérer tous les éléments à migrer
            for (var i = 0; i < migrations.length; i++) {
                var m = migrations[i];
                try {
                    var res = await supabaseClient.from(m.table).select('id, ' + m.champ).like(m.champ, 'https://abwguixclmxtzvlsmbby.supabase.co%');
                    if (res.data && res.data.length > 0) {
                        log('📋 ' + m.table + '.' + m.champ + ' → ' + res.data.length);
                        res.data.forEach(function(item) {
                            taches.push({ table: m.table, champ: m.champ, bucket: m.bucket, item: item });
                        });
                    }
                } catch (err) {
                    log('❌ Erreur lecture ' + m.table + '.' + m.champ + ' : ' + err.message, 'error');
                }
            }

            log('📊 Total : ' + taches.length + ' élément(s) à migrer');
            log('─────────────────────────');

            if (taches.length === 0) {
                log('✨ Rien à migrer !', 'success');
                btn.disabled = false;
                btn.innerText = '▶️ Relancer';
                return;
            }

            var total = taches.length;
            var reussis = 0;
            var echecs = 0;

            // 2. Migrer un par un
            for (var j = 0; j < taches.length; j++) {
                var t = taches[j];
                var id = t.item.id;
                var urlOrigine = t.item[t.champ];

                log('📥 [' + (j+1) + '/' + total + '] ' + t.table + ' #' + id);

                try {
                    var response = await fetch(urlOrigine);
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    var blob = await response.blob();

                    var nomFichier = 'fichier.jpg';
                    if (urlOrigine.indexOf('.png') !== -1) nomFichier = 'fichier.png';
                    else if (urlOrigine.indexOf('.pdf') !== -1) nomFichier = 'fichier.pdf';

                    var file = new File([blob], nomFichier, { type: blob.type || 'image/jpeg' });

                    var result = await EduStorage.uploaderFichier(file, t.bucket, {
                        userId: 'migration',
                        maxSizeMo: 20
                    });

                    var upd = await supabaseClient.from(t.table).update({ [t.champ]: result.url }).eq('id', id);
                    if (upd.error) throw upd.error;

                    log('   ✅ ' + Math.round(blob.size / 1024) + ' Ko → ' + result.url.substring(result.url.lastIndexOf('/') + 1), 'success');
                    reussis++;
                } catch (err) {
                    log('   ❌ Échec : ' + err.message, 'error');
                    echecs++;
                }

                majProgression(j + 1, total);
            }

            log('─────────────────────────');
            log('🎉 Migration terminée !', 'success');
            log('✅ Réussis : ' + reussis, 'success');
            if (echecs > 0) log('❌ Échecs : ' + echecs, 'error');

            btn.disabled = false;
            btn.innerText = '▶️ Relancer';
        }
    </script>
</body>
</html>
